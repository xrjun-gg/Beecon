services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: Beecon
      POSTGRES_PASSWORD: Beecon
      POSTGRES_DB: Beecon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Beecon -d Beecon"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://Beecon:Beecon@db:5432/Beecon
      PORT: "3100"
      SERVE_UI: "true"
      Paperclip_DEPLOYMENT_MODE: "authenticated"
      Paperclip_DEPLOYMENT_EXPOSURE: "private"
      Paperclip_PUBLIC_URL: "${Paperclip_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - Beecon-data:/Beecon
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  Beecon-data:
